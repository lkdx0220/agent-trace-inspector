[importlinter]
root_packages =
    app
    evaluator
    schemas
    exporter
    tools

; evaluator is the shared harness/scorers layer.
; Scorers must stay pure and must not depend on the legacy app layer.
[importlinter:contract:scorers-are-pure]
name = evaluator.scorers must not import app or exporter
type = forbidden
source_modules =
    evaluator.scorers
forbidden_modules =
    app
    exporter

; Harness is the evaluation orchestration layer and must not depend on app.
[importlinter:contract:harness-not-import-app]
name = evaluator.harness must not import app
type = forbidden
source_modules =
    evaluator.harness
forbidden_modules =
    app

; Schema layer must stay free of business implementation dependencies.
[importlinter:contract:schemas-are-pure]
name = schemas must not import app/evaluator/exporter/tools
type = forbidden
source_modules =
    schemas
forbidden_modules =
    app
    evaluator
    exporter
    tools
