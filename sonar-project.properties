# SonarCloud 配置。
# 首次使用：
#   1. 用 GitHub 登录 https://sonarcloud.io，导入 lkdx0220/agent-trace-inspector；
#   2. 生成 SONAR_TOKEN，加到 GitHub 仓库 Secrets；
#   3. 如果 SonarCloud 的组织 key 不是 lkdx0220，改下面的 sonar.organization。
sonar.projectKey=lkdx0220_agent-trace-inspector
sonar.organization=lkdx0220

sonar.projectName=agent-trace-inspector
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

sonar.sources=app,evaluator,schemas,exporter,tools
sonar.tests=tests
sonar.python.coverage.reportPaths=quality/reports/coverage.xml
# tools/ 是本地 CLI 入口，不计入库覆盖率；库代码覆盖率由 quality_gate + coverage.xml 控制。
sonar.coverage.exclusions=tools/**
# 忽略“本地 CLI 显式路径/已校验 HTTP 入参”的 taint 误报：
#   - evaluator/tools 的路径来自本机命令行，不是远程不可信输入；
#   - /api/runs/live 的 case_ids/name 已在 route 内做白名单校验。
sonar.issue.ignore.multicriteria=path_cli_eval,path_cli_tools,http_route_validated
sonar.issue.ignore.multicriteria.path_cli_eval.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.path_cli_eval.resourceKey=evaluator/**/*.py
sonar.issue.ignore.multicriteria.path_cli_tools.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.path_cli_tools.resourceKey=tools/**/*.py
sonar.issue.ignore.multicriteria.http_route_validated.ruleKey=pythonsecurity:S6350
sonar.issue.ignore.multicriteria.http_route_validated.resourceKey=app/routers/eval.py

sonar.exclusions=\
  **/__pycache__/**,\
  data/**,\
  runs/**,\
  quality/reports/**,\
  static/**

sonar.cpd.exclusions=\
  tests/**,\
  data/**,runs/**
